<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allure reports</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f4f6fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 760px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #687087;
      font-size: 16px;
      text-align: center;
    }

    .reports {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .report-link {
      display: block;
      min-height: 150px;
      padding: 24px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      background: #ffffff;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .report-link:hover {
      border-color: #3d6df2;
      box-shadow: 0 12px 28px rgba(33, 55, 95, 0.12);
      transform: translateY(-2px);
    }

    .label {
      margin: 0 0 10px;
      color: #3d6df2;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .title {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .description {
      margin: 0;
      color: #687087;
      font-size: 15px;
      line-height: 1.5;
    }

    .note {
      margin: 24px 0 0;
      color: #687087;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 28px;
      }

      .reports {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Allure отчеты</h1>
    <p class="subtitle">Проект с UI и API автотестами для практики</p>

    <section class="reports" aria-label="Список отчетов">
      <a class="report-link" href="ui-report/">
        <p class="label">UI</p>
        <p class="title">UI-тесты</p>
        <p class="description">Проверка сценариев на сайте igrovoy.rt.ru в Chrome.</p>
      </a>

      <a class="report-link" href="api-report/">
        <p class="label">API</p>
        <p class="title">API-тесты</p>
        <p class="description">Позитивные и негативные проверки сервиса сотрудников.</p>
      </a>
    </section>

    <p class="note">Отчеты сформированы командой allure generate.</p>
  </main>
</body>
</html>
